name: Deploy TRACCR to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Production Bundle with Encrypted Repository Secrets
        env:
          TRACCR_FIREBASE_API_KEY: ${{ secrets.TRACCR_FIREBASE_API_KEY }}
          TRACCR_FIREBASE_AUTH_DOMAIN: ${{ secrets.TRACCR_FIREBASE_AUTH_DOMAIN }}
          TRACCR_FIREBASE_PROJECT_ID: ${{ secrets.TRACCR_FIREBASE_PROJECT_ID }}
          TRACCR_FIREBASE_FALLBACK_PROJECT_ID: ${{ secrets.TRACCR_FIREBASE_FALLBACK_PROJECT_ID || 'tracer-dmg' }}
        run: |
          npm install --no-audit --no-fund
          node server.js --build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
